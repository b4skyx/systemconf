# Font and colors copied from ~/.config/kitty/kitty.conf.
# Alacritty does not render font ligatures or provide Kitty's tabs/borders.

[window]
decorations = "None"
startup_mode = "Maximized"
padding = { x = 12, y = 12 }
dynamic_padding = false

[font]
size = 14.0
normal = { family = "CodeliaLigatures Nerd Font", style = "Regular" }

[colors.primary]
foreground = "#ebdbb2"
background = "#282828"

[colors.cursor]
cursor = "#928374"
text = "#282828"

[colors.selection]
text = "#928374"
background = "#ebdbb2"

[colors.normal]
black = "#665c54"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#7c6f64"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#bdae93"

[bell]
color = "#8ec07c"
