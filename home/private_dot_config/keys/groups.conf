# keys: which gopass entries become environment variables in fish and bash.
# No secrets in this file (safe to sync).
#
# Format (whitespace separated, one group per line):
#   <group>  <gopass-folder>  <default-provider>  VAR=SOURCE [VAR=SOURCE ...]
#
# The active entry is <gopass-folder>/<provider>. SOURCE is:
#   @key     first line of the entry (the key itself)
#   field    a "field: value" line of the entry (required)
#   field?   optional field; VAR is unset when the entry lacks it
#
# Switch provider:  keys use <group> <provider>     (see: keys help)
#
# Example for OpenAI-compatible providers (entries llm/openai/<provider>):
#   openai  llm/openai  provider1  OPENAI_API_KEY=@key OPENAI_BASE_URL=base_url?

gemini         llm/gemini      personal  GEMINI_API_KEY=@key
databricks-na  llm/databricks  na        DATABRICKS_NA_API_KEY=@key
databricks-eu  llm/databricks  eu        DATABRICKS_EU_API_KEY=@key
oxicord        tokens/oxicord  personal  OXICORD_TOKEN=@key
