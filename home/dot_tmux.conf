set -g @plugin 'tmux-plugins/tmux-yank'
# Keep mouse selections active for a subsequent prefix + y.
set -g @yank_action 'copy-pipe-no-clear'
# Mouse and keyboard yanks should both use the regular system clipboard.
set -g @yank_selection_mouse 'clipboard'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'

# Tmux Configuration

# Terminal settings for true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB,xterm-256color:RGB"

# Forward focus events (Neovim reloads files changed on disk on FocusGained)
set -g focus-events on

# Enable extended keys for better key handling
set -g extended-keys on
set -g extended-keys-format csi-u

# Cursor shape
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

set -sg escape-time 0

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Prefix
set -g prefix C-a

# Keys
unbind 'l'
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

bind-key o split-window -h
bind-key O split-window -v

# Break and join pane
bind-key \\ break-pane -d -n _hidden_pane
bind-key \| join-pane -s $.1

bind-key b set-option status
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# don't rename windows automatically
set-option -g allow-rename off

set -g mouse on

# Statusline

set -g status-position bottom
set -g status-bg '#2a2f33'
set -g status-justify 'left'
set -g status-left-length '100'
set -g status-right-length '100'
# How often #(…) commands in the status line are refreshed
set -g status-interval 5
# tmux >= 3.2 defaults this to `underscore`; disable it
setw -g window-status-current-style default
setw -g window-status-separator ''

# Left: session badge (turns pink while prefix is held) + session name
set -g status-left '#[bg=#f8f8f2,fg=#282a36]#{?client_prefix,#[bg=#ff79c6],} = #[bg=default]#[fg=#9aa1a8] #S '

# Right: pane dir · git branch (* = dirty) · host · clock, for the focused pane.
# Git info comes from a helper script — inline #() gets mangled by tmux's
# strftime expansion (printf %s becomes a timestamp).
set -g status-right '#[fg=#9aa1a8]#{?#{==:#{pane_current_path},$HOME},~ #{?window_zoomed_flag,,},#{b:pane_current_path} }#[fg=#50fa7b]#(~/.tmux/status-git.sh "#{pane_current_path}")#[fg=#9aa1a8] #[fg=#6272a4]#h #[fg=#bfddb2]%H:%M '

# Windows: dim for inactive, inverted (light bg) for the active one;
# `*` marks windows with activity
setw -g window-status-format '#[fg=#9aa1a8,bg=#2e3338] #I #W#{?window_activity_flag,*,} '
setw -g window-status-current-format '#[fg=#282a36,bg=#bfddb2,bold] #I #W #{?window_zoomed_flag,[Z],} '

set -g status on

# Panes
setw -g pane-border-status off

# Number windows and panes starting at 1
set -g base-index 1
setw -g pane-base-index 1

# Clipboard (OSC 52) and escape-sequence passthrough (images, OSC 52 from nested apps)
set -g set-clipboard on
set -g allow-passthrough all

# Load tmux plugins
run '~/.tmux/plugins/tpm/tpm'

# Prefix + y: yank an active selection via the plugin's copy-mode binding.
# Without a selection, retain tmux-yank's normal whole-line copying.
# Keep this after TPM so the plugin cannot overwrite it during config reload.
bind-key y if-shell -F '#{selection_present}' 'send-keys y' 'run-shell -b ~/.tmux/plugins/tmux-yank/scripts/copy_line.sh'
